# إعدادات Netlify — Next.js 16 (App Router)
# المستودع: https://github.com/hasonae/shatlet

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# أضف DATABASE_URL من Netlify:
# Project settings → Environment variables → Add variable
# DATABASE_URL = postgresql://<user>:<pass>@<host>:5432/<db>
